# ntfy 서버 주소 (로컬 단독 실행 시)
ntfy.base-url=${NTFY_BASE_URL:http://localhost:9999}

# ntfy 알림 버튼의 Ack 콜백이 올 주소 (외부에서 접근 가능해야 함)
oncall.ack-base-url=${ONCALL_ACK_BASE_URL:http://localhost:8080}

# 담당자 미응답 시 에스컬레이션까지 대기 시간 (초)
oncall.escalation-timeout-seconds=${ONCALL_ESCALATION_TIMEOUT_SECONDS:300}

# Railway는 PORT 환경변수로 포트를 지정함
server.port=${PORT:8080}

# actuator: health 엔드포인트만 노출 (Railway healthcheck 경로)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
